<title>Nora上岸 · 备考工作台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --mint-50:#f3fbf8;
  --mint-100:#e6f7f1;
  --mint-200:#c8ecdd;
  --mint-300:#a8e0cc;
  --mint-400:#7dd3b6;
  --mint-500:#5cc4a3;
  --mint-600:#3da98b;
  --aqua-100:#d9f3f1;
  --aqua-200:#b8e8e6;
  --aqua-300:#8fd9d6;
  --aqua-400:#5fc4c0;
  --aqua-500:#3aaba8;
  --blue-macaron:#b9dff5;
  --blue-macaron-2:#a3d3ee;
  --pink-macaron:#ffd6e7;
  --pink-macaron-2:#ffc1dc;
  --yellow-macaron:#fff2c2;
  --peach-macaron:#ffd9c2;
  --lavender-macaron:#e0d4ff;
  --text-1:#2a3d3a;
  --text-2:#5a6f6c;
  --text-3:#8aa3a0;
  --bg:#f3fbf8;
  --card:#ffffff;
  --card-soft:#f9fdfc;
  --line:#d8ece6;
  --shadow:0 8px 24px -8px rgba(60,170,150,.18);
  --shadow-soft:0 4px 16px -4px rgba(60,170,150,.12);
  --radius:18px;
  --radius-sm:12px;
  --radius-lg:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text-1);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text-1);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--mint-400)}
textarea{resize:vertical;min-height:60px}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden;background:linear-gradient(135deg,#eaf7f1 0%,#d8f0e8 50%,#cfeae8 100%)}
.sidebar{width:240px;flex-shrink:0;background:linear-gradient(180deg,#e6f7f1 0%,#d6efea 100%);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;position:relative;transition:margin-left .28s ease;z-index:50}
.sidebar.collapsed{margin-left:-240px;box-shadow:none}
.sidebar::before{content:"";position:absolute;top:0;left:0;right:0;height:160px;background:linear-gradient(135deg,rgba(168,224,204,.4),rgba(184,232,230,.3));pointer-events:none}
.user-card{position:relative;padding:18px 16px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px dashed rgba(93,170,160,.18)}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--mint-300),var(--aqua-300));display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow-soft);position:relative;flex-shrink:0}
.avatar::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.user-info{flex:1;min-width:0}
.user-name{font-size:14px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:4px}
.user-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--mint-500);box-shadow:0 0 6px var(--mint-500);flex-shrink:0}
.conn-dot.off{background:#d0a8a8;box-shadow:0 0 6px #d0a8a8}
.nav-list{flex:1;overflow-y:auto;padding:8px 0 20px;position:relative;scrollbar-width:thin;scrollbar-color:var(--mint-300) transparent}
.nav-list::-webkit-scrollbar{width:4px}
.nav-list::-webkit-scrollbar-thumb{background:var(--mint-300);border-radius:2px}
.nav-group-title{padding:10px 18px 4px;font-size:13px;color:var(--text-2);letter-spacing:0;font-weight:600;display:flex;align-items:center;gap:6px}
.nav-group-title::before{content:"";width:12px;height:1px;background:var(--text-3);opacity:.4}
.nav-group-title.collapsible{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.nav-group-title.collapsible:hover{color:var(--mint-600)}
.nav-group-title.collapsible::before{display:none}
.ng-caret{display:inline-block;width:12px;font-size:9px;opacity:.7;transition:transform .15s}
.nav-foot{margin-top:auto;padding:10px 14px 16px;flex-shrink:0}
.nav-install-btn{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:12px;background:linear-gradient(135deg,var(--mint-400),var(--aqua-400));color:#fff;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;box-shadow:var(--shadow-soft);-webkit-tap-highlight-color:transparent}
.nav-install-btn.ready{box-shadow:0 0 0 2px rgba(255,255,255,.6),0 4px 14px rgba(80,180,140,.4);animation:pwaPulse 1.6s infinite}
.nav-install-btn.installed{background:#e8f3ef;color:var(--text-2);box-shadow:none;cursor:default;animation:none}
.nav-dl-link{display:block;text-align:center;margin-top:8px;font-size:11.5px;color:var(--text-2);text-decoration:none;opacity:.75}
.nav-dl-link:active{opacity:1}
@keyframes pwaPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13px;color:var(--text-2);cursor:pointer;position:relative;border-left:3px solid transparent;transition:all .25s}
.nav-item:hover{background:rgba(255,255,255,.4);color:var(--text-1)}
.nav-item.active{background:linear-gradient(90deg,rgba(255,255,255,.85),rgba(255,255,255,.5));color:var(--mint-600);font-weight:600;border-left-color:var(--mint-500)}
.nav-item.dragging{opacity:.5;background:#fff}
.nav-item.drag-over{border-top:2px solid var(--mint-500)}
.nav-item .ico{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:15px;background:#fff;border-radius:8px;flex-shrink:0;box-shadow:0 2px 4px rgba(93,170,160,.12)}
.nav-item.active .ico{background:linear-gradient(135deg,var(--mint-300),var(--aqua-300))}
.nav-item.sub{padding-left:32px;font-size:12.5px}
.nav-item.sub .ico{width:20px;height:20px;font-size:12px;border-radius:6px}
.drag-handle{margin-left:auto;opacity:0;font-size:11px;color:var(--text-3);cursor:grab}
.nav-item:hover .drag-handle{opacity:1}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:46px;background:rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;padding:0 16px;gap:10px;border-bottom:1px solid var(--line)}
.topbar .title{font-size:13px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:6px}
.menu-btn{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text-2);cursor:pointer;background:rgba(255,255,255,.6);border:1px solid var(--line);flex-shrink:0;-webkit-tap-highlight-color:transparent;transition:all .2s}
.menu-btn:hover{background:#fff;color:var(--mint-600)}
.topbar .spacer{flex:1}
.topbar .pill{padding:4px 10px;background:rgba(255,255,255,.7);border-radius:20px;font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:4px;border:1px solid var(--line)}
.pill .pdot{width:6px;height:6px;border-radius:50%;background:var(--mint-500)}
.pill .pdot.off{background:#d0a8a8}
.content{flex:1;overflow-y:auto;padding:14px 16px 30px;scrollbar-width:thin;scrollbar-color:var(--mint-300) transparent}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--mint-300);border-radius:3px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px;gap:10px}
.page-title{font-size:22px;font-weight:700;color:var(--text-1);display:flex;align-items:center;gap:8px;letter-spacing:.5px}
.page-title .em{font-size:24px}
.page-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.icon-btn{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow-soft);transition:transform .15s}
.icon-btn:hover{transform:scale(1.05)}
.icon-btn:active{transform:scale(.95)}
.btn{padding:8px 14px;border-radius:12px;background:linear-gradient(135deg,var(--mint-400),var(--aqua-400));color:#fff;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-soft);display:inline-flex;align-items:center;gap:4px}
.btn:hover{filter:brightness(1.05)}
.btn.soft{background:#fff;color:var(--mint-600);border:1.5px solid var(--mint-300)}
.btn.pink{background:linear-gradient(135deg,#ffb0d0,#ffa1c1);color:#fff}
.btn.warn{background:linear-gradient(135deg,#ffcca8,#ffba8a);color:#fff}
.card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden}
.card.soft{background:var(--card-soft);box-shadow:var(--shadow-soft)}
.card-title{font-size:14px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.card-title .deco{width:4px;height:14px;background:linear-gradient(180deg,var(--mint-400),var(--aqua-400));border-radius:2px}
.countdown-hero{background:linear-gradient(135deg,#ffd6e7 0%,#c8ecdd 50%,#b8e8e6 100%);border-radius:var(--radius-lg);padding:18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 30px -10px rgba(255,150,200,.4)}
.countdown-hero::before{content:"";position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25)}
.countdown-hero::after{content:"";position:absolute;bottom:-40px;left:30%;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18)}
.countdown-hero .ct-top{position:relative;display:flex;align-items:center;justify-content:space-between;font-size:13px;opacity:.95}
.countdown-hero .ct-num{position:relative;font-size:54px;font-weight:800;line-height:1.1;margin:6px 0 4px;letter-spacing:-1px;text-shadow:0 2px 8px rgba(0,0,0,.1)}
.countdown-hero .ct-num small{font-size:18px;font-weight:600;margin-left:4px;opacity:.9}
.countdown-hero .ct-date{position:relative;font-size:12px;opacity:.9}
.countdown-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.countdown-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);padding:8px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.5)}
.countdown-item .ci-name{font-size:13px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:6px}
.countdown-item .ci-days{font-size:18px;font-weight:700;color:var(--mint-600);display:flex;align-items:baseline;gap:2px}
.countdown-item .ci-days small{font-size:10px;color:var(--text-3);font-weight:500}
.countdown-item .ci-date{font-size:10px;color:var(--text-3)}
.progress{height:8px;background:rgba(255,255,255,.5);border-radius:4px;overflow:hidden;margin:6px 0}
.progress .pf{height:100%;background:linear-gradient(90deg,var(--mint-400),var(--aqua-400));border-radius:4px;transition:width .5s}
.plan-row{display:flex;align-items:center;gap:10px;padding:9px 10px;background:#fff;border-radius:12px;margin-bottom:6px;border:1px solid var(--line);transition:all .2s}
.plan-row.done{background:linear-gradient(90deg,#eaf7f1,#d6efea);border-color:var(--mint-300)}
.plan-row .pname{flex:1;font-size:13px;color:var(--text-1)}
.plan-row .pmeta{font-size:11px;color:var(--text-3)}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--mint-300);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;transition:all .2s}
.check.checked{background:linear-gradient(135deg,var(--mint-400),var(--aqua-400));border-color:transparent;color:#fff}
.empty{text-align:center;padding:30px 20px;color:var(--text-3);font-size:12px}
.empty .em{font-size:36px;display:block;margin-bottom:8px;opacity:.6}
.modal-mask{position:fixed;inset:0;background:rgba(40,60,58,.4);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:380px;max-height:85vh;overflow-y:auto;padding:18px;animation:pop .25s;box-shadow:0 20px 50px -10px rgba(40,80,70,.3)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin:0 0 12px;font-size:16px;color:var(--text-1);display:flex;align-items:center;gap:6px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--text-3);margin-bottom:4px;font-weight:500}
.field input,.field textarea,.field select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.modal-actions{display:flex;gap:8px;margin-top:12px}
.modal-actions .btn{flex:1;justify-content:center}
.tag-pill{display:inline-flex;align-items:center;padding:3px 8px;background:var(--mint-100);color:var(--mint-600);border-radius:8px;font-size:11px;font-weight:600;margin-right:4px}
.tab-bar{display:flex;background:rgba(255,255,255,.5);padding:3px;border-radius:12px;margin-bottom:10px;gap:2px}
.tab-bar .tab{flex:1;padding:6px;text-align:center;font-size:12px;color:var(--text-2);border-radius:9px;cursor:pointer;transition:all .2s;font-weight:500}
.tab-bar .tab.active{background:#fff;color:var(--mint-600);font-weight:600;box-shadow:0 2px 6px rgba(93,170,160,.15)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.stat-card{background:linear-gradient(135deg,#fff,#f3fbf8);border-radius:14px;padding:10px 8px;text-align:center;border:1px solid var(--line)}
.stat-card .sv{font-size:18px;font-weight:700;color:var(--mint-600)}
.stat-card .sl{font-size:10px;color:var(--text-3);margin-top:2px}
.stat-card .si{font-size:14px;margin-bottom:2px}
.chart-wrap{position:relative;height:190px;margin-top:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#fbfdfc,#f3fbf8);border-radius:14px;border:1px solid var(--mint-100);padding:8px 6px}
.chart-wrap::-webkit-scrollbar{height:6px}
.chart-wrap::-webkit-scrollbar-thumb{background:rgba(140,200,180,.5);border-radius:3px}
.chart-wrap::-webkit-scrollbar-track{background:transparent}
.chart-inner{position:relative;height:100%;min-width:100%}
.chart-box{position:relative}
/* 全屏模式 */
.chart-box:fullscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;padding:16px;width:100vw;height:100vh;box-sizing:border-box}
.chart-box:fullscreen .chart-fs{top:10px;right:10px;z-index:9999}
.chart-box:fullscreen .chart-wrap{overflow:hidden;border:none;background:#fff;height:calc(100vh - 40px)!important;width:100%;max-width:1200px;border-radius:16px;box-shadow:0 4px 30px rgba(40,80,70,.12)}
.chart-box:fullscreen .chart-inner{width:100%!important;height:100%}
.chart-fs{position:absolute;top:6px;right:6px;z-index:6;width:auto;height:28px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.92);border:1px solid var(--mint-200);color:var(--mint-600);font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(40,80,70,.12);transition:transform .15s;font-weight:600;letter-spacing:.5px}
.chart-fs:active{transform:scale(.88)}
.qa-row{display:flex;align-items:center;gap:8px;padding:9px 12px;background:linear-gradient(90deg,var(--mint-50),#fff);border-radius:12px;margin-bottom:6px;border:1px solid var(--mint-100)}
.qa-row .qname{flex:1;font-size:12.5px}
.qa-row .qmeta{font-size:11px;color:var(--text-3)}
.mini-stat{display:flex;align-items:baseline;gap:3px;font-size:12px;color:var(--text-2)}
.mini-stat strong{color:var(--mint-600);font-weight:700}
.tag{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--mint-100);color:var(--mint-600);font-weight:600}
.tag.pink{background:var(--pink-macaron);color:#c6688e}
.tag.yellow{background:var(--yellow-macaron);color:#a8893a}
.tag.blue{background:var(--blue-macaron);color:#3a6e8a}
.tag.lav{background:var(--lavender-macaron);color:#7a5cb3}
.tag.peach{background:var(--peach-macaron);color:#c66b3a}
.wrong-row{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);position:relative}
.wrong-row .wr-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.wrong-row .wr-body{font-size:12.5px;color:var(--text-1);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.wrong-row .wr-img{width:60px;height:60px;border-radius:8px;object-fit:cover;margin-top:6px;border:1px solid var(--line)}
.wrong-row .wr-audio{display:flex;align-items:center;gap:6px;margin-top:6px;padding:6px 10px;background:var(--mint-50);border-radius:8px;width:fit-content}
.wrong-row .wr-time{font-size:10px;color:var(--text-3);margin-top:4px}
.wrong-row .wr-del{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#fff5f5;color:#e0a0a0;display:flex;align-items:center;justify-content:center;font-size:11px}
.input-tabs{display:flex;gap:6px;margin-bottom:8px}
.input-tab{flex:1;padding:6px;text-align:center;background:rgba(255,255,255,.6);border-radius:10px;font-size:11px;color:var(--text-2);cursor:pointer;border:1px solid var(--line)}
.input-tab.active{background:linear-gradient(135deg,var(--mint-300),var(--aqua-300));color:#fff;border-color:transparent;font-weight:600}
.record-btn{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--pink-macaron),var(--peach-macaron));color:#c6688e;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.record-btn.recording{background:linear-gradient(135deg,#ffb0d0,#ff9abf);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,150,200,.4)}50%{box-shadow:0 0 0 8px rgba(255,150,200,0)}}
.timer-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:#fff;border-radius:8px;font-size:11px;color:var(--text-2);box-shadow:var(--shadow-soft)}
.timer-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--mint-500);animation:pulse 1.5s infinite}
.welcome-card{background:linear-gradient(135deg,var(--mint-200),var(--aqua-200));border-radius:var(--radius-lg);padding:16px;color:var(--text-1);position:relative;overflow:hidden;margin-bottom:12px}
.welcome-card::after{content:"❀";position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:80px;opacity:.18}
.welcome-card .wt{font-size:16px;font-weight:700;margin-bottom:3px}
.welcome-card .wd{font-size:11.5px;color:var(--text-2)}
.welcome-card .wm{margin-top:8px;font-size:11px;color:var(--text-3)}
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.module-card{background:#fff;border-radius:14px;padding:12px;border:1px solid var(--line);box-shadow:var(--shadow-soft);cursor:pointer;transition:transform .15s,box-shadow .2s}
.module-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.module-card .mc-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.module-card .mc-ico{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--mint-200),var(--aqua-200));display:flex;align-items:center;justify-content:center;font-size:14px}
.module-card .mc-name{font-size:13px;font-weight:600;color:var(--text-1);flex:1}
.module-card .mc-arr{color:var(--text-3);font-size:14px}
.module-card .mc-desc{font-size:10.5px;color:var(--text-3);line-height:1.5;margin-bottom:6px;min-height:30px}
.module-card .mc-meta{display:flex;gap:8px;font-size:10.5px}
.module-card .mc-meta .mm{display:flex;align-items:center;gap:2px;color:var(--text-2)}
.module-card .mc-meta strong{color:var(--mint-600);font-weight:700}
.tarot-card{background:linear-gradient(135deg,#fff,#f9fdfc);border-radius:18px;padding:16px;position:relative;overflow:hidden;border:1px solid var(--line)}
.tarot-card::before{content:"";position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(168,224,204,.4),transparent 70%);pointer-events:none}
.tarot-card .tc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tarot-card .tc-img{width:54px;height:78px;border-radius:8px;background:linear-gradient(135deg,var(--lavender-macaron),var(--blue-macaron));display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:var(--shadow);flex-shrink:0}
.tarot-card .tc-name{font-size:15px;font-weight:700;color:var(--text-1)}
.tarot-card .tc-period{font-size:11px;color:var(--text-3);margin-top:2px}
.tarot-card .tc-meaning{font-size:12px;color:var(--text-2);line-height:1.6;background:rgba(255,255,255,.5);padding:8px 10px;border-radius:10px;border:1px dashed var(--mint-200);white-space:pre-wrap}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--mint-200),transparent);margin:14px 0}
.pet-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,var(--mint-200),var(--aqua-200));flex-shrink:0;box-shadow:var(--shadow-soft);border:2px solid rgba(255,255,255,.8)}
.memo-row{display:flex;gap:10px;padding:10px 12px;background:#fff;border-radius:14px;margin-bottom:8px;border:1px solid var(--line);align-items:flex-start}
.memo-row.due{background:linear-gradient(135deg,#fff,#fff0f6);border-color:var(--pink-macaron)}
.memo-row.urgent{background:linear-gradient(135deg,#fff,#ffe3ec);border-color:#ff9abf;animation:petpulse 1.6s infinite}
@keyframes petpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,154,191,.35)}50%{box-shadow:0 0 0 7px rgba(255,154,191,0)}}
.memo-row .m-body{flex:1;min-width:0}
.memo-row .m-title{font-size:13px;font-weight:600;color:var(--text-1)}
.memo-row .m-content{font-size:11.5px;color:var(--text-2);line-height:1.5;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.memo-row .m-due{font-size:11px;margin-top:5px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.memo-row .m-due .dd{font-weight:700;color:var(--mint-600)}
.memo-row .m-due.urgent .dd{color:#e0558a}
.memo-row .m-actions{display:flex;flex-direction:column;gap:4px;align-items:center}
.section-label{font-size:11px;color:var(--text-3);font-weight:600;letter-spacing:1px;margin:8px 0 8px;display:flex;align-items:center;gap:6px}
.section-label::before{content:"✿";color:var(--mint-400);font-size:12px}
.kbd-hint{font-size:10px;color:var(--text-3);font-style:italic;margin-top:6px;text-align:center}
.daily-input{display:flex;gap:6px;margin-bottom:8px}
.daily-input input{flex:1;background:rgba(255,255,255,.9)}
.mode-toggle{display:flex;background:rgba(255,255,255,.6);border-radius:10px;padding:2px;gap:2px;border:1px solid var(--line)}
.mode-toggle .mt{padding:4px 8px;font-size:10.5px;color:var(--text-2);border-radius:8px;cursor:pointer}
.mode-toggle .mt.active{background:#fff;color:var(--mint-600);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.greet{font-size:12px;color:var(--mint-600);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.greet::before{content:"❀"}
@media (max-width: 720px){
  .sidebar{width:200px}
}
.nav-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:150;display:none}
.nav-close{display:none}
@media (max-width: 540px){
  .app{flex-direction:row}
  .main{width:100%}
  .sidebar{position:fixed;top:0;left:0;bottom:0;height:100vh;height:100dvh;width:240px;max-width:80vw;z-index:200;margin-left:0;transform:translateX(-100%);box-shadow:2px 0 20px rgba(0,0,0,.18);transition:transform .28s ease}
  .sidebar.collapsed{transform:translateX(-100%)}
  .sidebar:not(.collapsed){transform:translateX(0)}
  .nav-close{display:flex;position:absolute;top:12px;right:12px;width:32px;height:32px;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.7);border:1px solid var(--line);font-size:15px;color:var(--text-2);cursor:pointer;z-index:10}
  .user-card{padding:16px 14px 12px}
  .nav-list{display:block;overflow-y:auto;overflow-x:hidden;padding:8px 0 16px;gap:0;flex-wrap:nowrap}
  .nav-group-title{display:flex}
  .nav-foot{margin-top:auto;padding:10px 14px 16px;display:block}
  .nav-install-btn{margin:0;width:100%}
  .nav-dl-link{margin-top:8px}
  .nav-item{padding:9px 18px;background:transparent;border:none;border-radius:0;font-size:13px;white-space:normal;flex-shrink:1}
  .nav-item.sub{padding-left:32px}
  .nav-item.active{background:linear-gradient(90deg,rgba(255,255,255,.85),rgba(255,255,255,.5));color:var(--mint-600);font-weight:600;border-left-color:var(--mint-500)}
  .nav-item.active .ico{background:linear-gradient(135deg,var(--mint-300),var(--aqua-300))}
  .drag-handle{display:none}
  .paper-subj-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))!important}
  .paper-subj-grid .qa-row{padding:6px 8px;flex-direction:column;align-items:flex-start;gap:2px}
  .paper-subj-grid .qa-row .qname{font-size:11px}
  .paper-subj-grid .qa-row .qmeta{font-size:10px}
}
/* ===== 复盘仪表盘（WorkPulse 思路） ===== */
.rev-tabs{display:flex;gap:8px;margin-bottom:12px;}
.rev-tab{flex:1;text-align:center;padding:10px;background:#fff;border:1px solid rgba(168,224,204,.4);border-radius:12px;font-size:13px;color:var(--text-2);cursor:pointer;}
.rev-tab.active{background:#5cc4a3;color:#fff;border-color:#5cc4a3;font-weight:600;}
.rev-range{display:block;}
.rev-range-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.rev-rbtn{padding:6px 14px;border:1px solid rgba(168,224,204,.5);background:#fff;border-radius:18px;font-size:12px;color:var(--text-2);cursor:pointer;}
.rev-rbtn.active{background:#5cc4a3;color:#fff;border-color:#5cc4a3;}
.rev-range-inputs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.rev-range-inputs input[type=date]{padding:6px 8px;border:1px solid rgba(168,224,204,.5);border-radius:8px;font-size:12px;color:var(--text-2);background:#fff;}
.rev-report-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.rep-title{font-size:15px;font-weight:700;color:var(--mint-700,#2a3d3a);margin-bottom:12px;}
.rep-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.rep-row{display:flex;flex-direction:column;gap:4px;background:#f6faf8;border-radius:10px;padding:10px 12px;}
.rep-k{color:var(--text-2);font-size:12px;}
.rep-v{font-weight:700;color:var(--mint-600,#3aa98a);font-size:14px;}
.rep-subtitle{font-size:13px;font-weight:600;color:var(--text-2);margin:6px 0 8px;}
.rep-table{width:100%;border-collapse:collapse;font-size:12px;}
.rep-table th{text-align:left;color:var(--text-3);font-weight:600;padding:6px 4px;border-bottom:1px solid rgba(168,224,204,.3);}
.rep-table td{padding:6px 4px;border-bottom:1px solid #f0f4f2;color:var(--text-2);}
.rep-table .bar{height:14px;border-radius:7px;min-width:4px;max-width:100%;}
.rep-footer{margin-top:12px;font-size:11px;color:var(--text-3);text-align:right;}
.rep-empty{color:var(--text-3);font-size:12px;padding:8px 0;}
.rev-hint{font-size:11px;color:var(--text-3);}
.hm-wrap{overflow-x:auto;padding:4px 0;}
.hm-grid{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;gap:3px;width:max-content;}
.hm-cell{width:13px;height:13px;border-radius:3px;background:#ebf3ef;}
.hm-l0{background:#ebf3ef;}
.hm-l1{background:#cfe7dc;}
.hm-l2{background:#9fd3bd;}
.hm-l3{background:#5cc4a3;}
.hm-l4{background:#2f9e7c;}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-3);margin-top:8px;}
.hm-legend .hm-cell{width:11px;height:11px;}
.rev-stats{grid-template-columns:repeat(2,1fr);}
#reviewToast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(42,61,58,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99998;opacity:0;transition:opacity .3s;pointer-events:none;}
.rev-score-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.score-ring{width:124px;height:124px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.score-inner{width:96px;height:96px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.score-num{font-size:36px;font-weight:800;line-height:1}
.score-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.score-meta{flex:1;min-width:160px}
.score-label{font-size:18px;font-weight:800;margin-bottom:4px}
.score-desc{font-size:13px;color:var(--text-2);line-height:1.5}
.smart-dims{display:grid;gap:12px}
.smart-prio{display:block}
.smart-dim{border-radius:14px;padding:14px 16px;border-left:5px solid #ccc;background:#f3faf7}
.smart-dim.good{border-color:var(--mint-500);background:#eefaf5}
.smart-dim.warn{border-color:#ffb547;background:#fff8ec}
.smart-dim.danger{border-color:#ff6b6b;background:#fdeeee}
.sd-head{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.sd-ico{font-size:16px}
.sd-name{font-size:15px}
.sd-badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.sd-badge.warn{background:#ffe6bd;color:#b9791a}
.sd-badge.danger{background:#ffd4d4;color:#c0392b}
.sd-find{font-size:13px;color:var(--text-2);margin-bottom:8px;line-height:1.5}
.sd-tip{font-size:13px;color:var(--text-1);background:rgba(255,255,255,.65);border-radius:10px;padding:8px 10px;line-height:1.5}

const SYNC_KEY = 'nora_sync_cfg_v1';
const GIST_FILE = 'nora-shangan-data.json';
const GIST_DESC = 'Nora上岸·数据同步 (请勿手动编辑)';

let sync = { status:'local', lastSync:null, lastPushedAt:0, error:'' };
// status: local | syncing | connected | offline

function getSyncCfg(){
  try{ return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; }catch(e){ return {}; }
}
function setSyncCfg(c){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(c)); }catch(e){}
}
function ghHeaders(token){
  return { 'Authorization':'Bearer '+token, 'Content-Type':'application/json', 'Accept':'application/vnd.github+json' };
}
async function gistCreate(token, payload){
  const r = await fetch('https://api.github.com/gists', {
    method:'POST', headers:ghHeaders(token),
    body: JSON.stringify({ description:GIST_DESC, public:false, files:{ [GIST_FILE]:{ content:JSON.stringify(payload) } } })
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  return j.id;
}
async function gistUpdate(token, gistId, payload){
  const r = await fetch('https://api.github.com/gists/'+gistId, {
    method:'PATCH', headers:ghHeaders(token),
    body: JSON.stringify({ files:{ [GIST_FILE]:{ content:JSON.stringify(payload) } } })
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
}
async function gistRead(token, gistId){
  const r = await fetch('https://api.github.com/gists/'+gistId, { headers:ghHeaders(token) });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  const f = j.files && j.files[GIST_FILE];
  if(!f || !f.content) return null;
  try{ return JSON.parse(f.content); }catch(e){ return null; }
}

let _pushTimer = null;
function schedulePush(){
  const cfg = getSyncCfg();
  if(!cfg.token || !cfg.gistId) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(pushToCloud, 1500);
}
async function pushToCloud(){
  const cfg = getSyncCfg();
  if(!cfg.token || !cfg.gistId) return;
  if(!navigator.onLine){ sync.status='offline'; updateSyncStatus(); return; }
  sync.status='syncing'; updateSyncStatus();
  const payload = { v:1, updatedAt: state.updatedAt||Date.now(), state: state };
  try{
    await gistUpdate(cfg.token, cfg.gistId, payload);
    sync.lastSync = Date.now(); sync.lastPushedAt = Date.now(); sync.status='connected'; sync.error='';
  }catch(e){
    sync.status='offline'; sync.error = String(e.message||e);
  }
  updateSyncStatus();
}
async function pullFromCloud(showMsg){
  const cfg = getSyncCfg();
  if(!cfg.token || !cfg.gistId) return;
  if(!navigator.onLine){ sync.status='offline'; updateSyncStatus(); return; }
  sync.status='syncing'; updateSyncStatus();
  try{
    const remote = gistRead(cfg.token, cfg.gistId);
    const data = await remote;
    if(data && data.state){
      const rUpd = data.updatedAt||0;
      const lUpd = state.updatedAt||0;
      if(rUpd > lUpd){
        const dirty = lUpd > (sync.lastPushedAt||0);
        if(dirty && !confirm('云端有更新的数据，本地也有未同步的改动。\n点「确定」使用云端数据（覆盖本地）；点「取消」把本地数据推送到云端（覆盖云端）。')){
          await pushToCloud(); return;
        }
        state = data.state;
        if(!state.updatedAt) state.updatedAt = rUpd;
        saveDataLocalOnly();
        renderPage();
        sync.lastSync = Date.now(); sync.status='connected'; sync.error='';
        if(showMsg) toast('已从云端同步最新数据 ✨');
      } else {
        await pushToCloud();
      }
    } else {
      await pushToCloud();
    }
  }catch(e){
    sync.status='offline'; sync.error = String(e.message||e);
  }
  updateSyncStatus();
}

function updateSyncStatus(){
  const cd = document.getElementById('connDot');
  const pd = document.getElementById('pDot');
  const pt = document.getElementById('pText');
  let color='#b0b8b5', text='仅本地', title='未开启云端同步（点此开启）';
  if(sync.status==='connected'){ color='#5cc4a3'; text='云端已连接'; title='云端同步已开启，数据实时同步'; }
  else if(sync.status==='syncing'){ color='#5aa9e0'; text='同步中…'; title='正在与云端同步'; }
  else if(sync.status==='offline'){ color='#e0a0a0'; text='云端未连接'; title='云端同步失败：'+(sync.error||'网络或 Token 问题'); }
  if(cd){ cd.style.background=color; cd.style.boxShadow='0 0 6px '+color; cd.title=title; }
  if(pd){ pd.style.background=color; }
  if(pt){ pt.textContent=text; if(pt.parentElement) pt.parentElement.title=title; }
}

async function saveTokenAndInit(){
  const el = document.getElementById('syncToken');
  const v = (el && el.value ? el.value : '').trim();
  if(!v){ alert('请先粘贴 GitHub Token'); return; }
  sync.status='syncing'; updateSyncStatus();
  try{
    let gistId = null;
    const listR = await fetch('https://api.github.com/gists?per_page=100', { headers:ghHeaders(v) });
    if(listR.ok){
      const arr = await listR.json();
      const found = arr.find(g => g.files && g.files[GIST_FILE]);
      if(found) gistId = found.id;
    }
    if(!gistId){
      const payload = { v:1, updatedAt: state.updatedAt||Date.now(), state: state };
      gistId = await gistCreate(v, payload);
    } else {
      const remote = await gistRead(v, gistId);
      const r = await remote;
      if(r && r.state && (r.updatedAt||0) > (state.updatedAt||0)){
        state = r.state; if(!state.updatedAt) state.updatedAt = r.updatedAt; saveDataLocalOnly(); renderPage();
      }
    }
    setSyncCfg({ token:v, gistId:gistId });
    sync.lastSync = Date.now(); sync.lastPushedAt = Date.now(); sync.status='connected'; sync.error='';
    updateSyncStatus(); closeModal(); toast('云端同步已开启 ✨');
  }catch(e){
    sync.status='offline'; sync.error = String(e.message||e); updateSyncStatus();
    alert('开启失败：'+e.message+'。请确认 Token 有效且具有 gist 权限，且当前网络可访问 github.com');
  }
}

function logoutSync(){

}

function attachDrag(){
  const items = document.querySelectorAll('.nav-item');
  items.forEach(el=>{
    el.addEventListener('dragstart', e=>{
      dragSrcId = el.dataset.id;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    el.addEventListener('dragend', e=>{
      el.classList.remove('dragging');
      document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', e=>{
      e.preventDefault();
      document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('drag-over'));
      el.classList.add('drag-over');
    });
    el.addEventListener('drop', e=>{
      e.preventDefault();
      const targetId = el.dataset.id;
      if(!dragSrcId || dragSrcId===targetId) return;
      reorderNav(dragSrcId, targetId);
      dragSrcId = null;
    });
  });
}
function reorderNav(srcId, tgtId){
  const order = JSON.parse(JSON.stringify(getNavOrder()));
  let srcItem = null, srcGroup = null, srcIdx = -1;
  let tgtItem = null, tgtGroup = null, tgtIdx = -1;
  order.forEach(g=>{
    g.items.forEach((it,i)=>{
      if(it.id===srcId){srcItem=it;srcGroup=g;srcIdx=i}
      if(it.id===tgtId){tgtItem=it;tgtGroup=g;tgtIdx=i}
      if(it.sub && SUBMODULES[it.sub]){
        SUBMODULES[it.sub].forEach(s=>{
          if(s.id===srcId){srcItem=s;srcGroup=g;srcIdx=i}
          if(s.id===tgtId){tgtItem=s;tgtGroup=g;tgtIdx=i}
        });
      }
    });
  });
  if(!srcItem || !tgtItem) return;
  // move src to position of tgt within same group
  if(srcGroup===tgtGroup){
    const arr = srcGroup.items;
    arr.splice(srcIdx,1);
    const newIdx = arr.findIndex(x=>x.id===tgtItem.id || (x.sub && (SUBMODULES[x.sub]||[]).some(s=>s.id===tgtItem.id)));
    if(newIdx>=0) arr.splice(newIdx,0,srcItem);
  }
  setNavOrder(order);
  renderNav();
}

function renderLJChart(mode){
  mode = mode || 'day';
  const subs = SUBMODULES['judge'];
  const names = subs.map(s=>s.name);
  const list = state.qaStats.filter(q=>names.includes(q.module));
  const labels=[],count=[],rate=[];
  function frame(label, fn){
    const sub=list.filter(fn);
    const tc=sub.reduce((a,q)=>a+q.count,0);
    const cc=sub.reduce((a,q)=>a+q.correct,0);
    labels.push(label);count.push(tc);rate.push(tc?Math.round(cc/tc*100):null);
  }
  if(mode==='day'){
    for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const s=d.toISOString().slice(0,10);frame(`${d.getMonth()+1}/${d.getDate()}`,q=>q.date===s);}
  } else if(mode==='week'){
    for(let i=7;i>=0;i--){const end=new Date();end.setDate(end.getDate()-i*7);const start=new Date(end);start.setDate(start.getDate()-6);const s=start.toISOString().slice(0,10),e=end.toISOString().slice(0,10);frame(`${start.getMonth()+1}/${start.getDate()}`,q=>q.date>=s&&q.date<=e);}
  } else if(mode==='month'){
    for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const ym=d.toISOString().slice(0,7);frame(`${d.getMonth()+1}月`,q=>q.date.startsWith(ym));}
  } else {
    for(let i=11;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const ym=d.toISOString().slice(0,7);frame(`${d.getMonth()+1}月`,q=>q.date.startsWith(ym));}
  }
  prepChartWrap('ljChart', labels.length);
  ensureChart('ljChart',{
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'题数',data:count,borderColor:'#5fc4c0',backgroundColor:'rgba(95,196,192,.15)',borderWidth:2,tension:.4,pointRadius:3,fill:false,yAxisID:'y'},
        {label:'正确率%',data:rate,borderColor:'#ff9abf',backgroundColor:'rgba(255,154,191,.18)',borderWidth:2,tension:.4,pointRadius:3,fill:false,spanGaps:true,yAxisID:'y1'}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,position:'top',labels:{boxWidth:10,font:{size:10},color:'#5a6f6c'}}},
      scales:{
        x:{grid:{display:false},ticks:{color:'#8aa3a0',font:{size:10}}},
        y:{position:'left',grid:{color:'rgba(168,224,204,.2)'},ticks:{color:'#8aa3a0',font:{size:10}},beginAtZero:true},
        y1:{position:'right',grid:{display:false},ticks:{color:'#8aa3a0',font:{size:10},callback:v=>v+'%'},min:0,max:100,beginAtZero:true}
      }
    }
  });
}

/* ============ Charts ============ */
let charts = {};
function ensureChart(id, cfg){
  const el = document.getElementById(id);
  if(!el) return;
  if(charts[id]){charts[id].destroy();}
  charts[id] = new Chart(el, cfg);
}
/* 横滑容器：让图表按数据点数量撑宽，超出屏幕可左右拖动 */
function prepChartWrap(id, n){
  const wrap = document.getElementById(id);
  if(!wrap) return;
  let inner = wrap.querySelector('.chart-inner');
  if(!inner){
    inner = document.createElement('div');
    inner.className = 'chart-inner';
    const cv = wrap.querySelector('canvas');
    if(cv) inner.appendChild(cv);
    wrap.appendChild(inner);
  }
  const visW = wrap.clientWidth || 320;
  inner.style.width = Math.max(visW, n * 46) + 'px';
}

/* ====== 全屏图表覆盖层（手动「横屏」按钮 + 强制 CSS 旋转，不依赖方向检测）====== */
let _fsOverlay = null;
let _fsResizeHandler = null;
function fsChart(id){
  if(_fsOverlay){ closeFsOverlay(); return; }
  var origCanvas = document.getElementById(id);
  if(!origCanvas) return;
  var parentWrap = origCanvas.parentNode;
  if(!parentWrap) return;

  _fsOverlay = document.createElement('div');
  _fsOverlay.id = 'chartFsOverlay';
  _fsOverlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff;display:flex;flex-direction:column';
  _fsOverlay.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e8f0ec;background:linear-gradient(135deg,#eaf7f1,#d8f0e8);flex-shrink:0">'
    + '<span style="font-size:14px;font-weight:700;color:#3a5c52">📊 全屏图表</span>'
    + '<button id="fsCloseBtn" style="padding:6px 16px;border-radius:18px;background:var(--mint-400);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)">✕ 关闭</button>'
    + '</div>'
    + '<div id="fsChartBox" style="flex:1;position:relative;overflow:hidden"></div>';
  document.body.appendChild(_fsOverlay);

  var box = document.getElementById('fsChartBox');
  box.appendChild(origCanvas);
  origCanvas.style.width = '100%';
  origCanvas.style.height = '100%';
  _fsOverlay._origParent = parentWrap;
  _fsOverlay._chartId = id;

  document.getElementById('fsCloseBtn').addEventListener('click', closeFsOverlay);
  _fsOverlay.addEventListener('click', function(e){ if(e.target===_fsOverlay) closeFsOverlay(); });

  _fsResizeHandler = function(){
    try{ var c=charts[id]; if(c&&c.resize) c.resize(); }catch(e){}
  };
  window.addEventListener('resize', _fsResizeHandler);

  setTimeout(function(){ try{ var c=charts[id]; if(c&&c.resize) c.resize(); }catch(e){} }, 100);
}

function closeFsOverlay(){
  if(_fsOverlay){
    var canvas = document.getElementById(_fsOverlay._chartId);
    var parent = _fsOverlay._origParent;
    if(canvas && parent && parent.isConnected){
      parent.appendChild(canvas);
      canvas.style.width = '';
      canvas.style.height = '';
    }
    try{ var ch = charts[_fsOverlay._chartId]; if(ch && ch.resize) ch.resize(); }catch(e){}
    _fsOverlay.remove();
    _fsOverlay = null;
  }
  if(_fsResizeHandler){ window.removeEventListener('resize', _fsResizeHandler); _fsResizeHandler = null; }
}
function resizeAllCharts(){
  document.querySelectorAll('.chart-wrap').forEach(function(wrap){
    var inner = wrap.querySelector('.chart-inner');
    if(!inner)return;
    var cv = inner.querySelector('canvas');
    if(cv&&cv.id){var ch=charts[cv.id];if(ch&&ch.data&&ch.data.labels)inner.style.width=Math.max(wrap.clientWidth||320,ch.data.labels.length*46)+'px';}
  });
  Object.values(charts).forEach(function(c){try{if(c&&c.resize)c.resize();}catch(e){}});
}
document.addEventListener('fullscreenchange',function(){setTimeout(resizeAllCharts,200)});
window.addEventListener('resize',resizeAllCharts);

function aggTime(mode){
  const now = new Date();
  const arr = state.studyTime.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(mode==='day'){
    const labels = [], data = [];
    for(let i=13;i>=0;i--){
      const d = new Date();d.setDate(d.getDate()-i);
      const s = d.toISOString().slice(0,10);
      labels.push(`${d.getMonth()+1}/${d.getDate()}`);
      const m = arr.filter(t=>t.date===s).reduce((s,t)=>s+t.minutes,0);
      data.push(m/60);
    }
    return {labels,data,unit:'h'};
  }
  if(mode==='week'){
    const labels=[],data=[];
    for(let i=7;i>=0;i--){
      const end = new Date();end.setDate(end.getDate()-i*7);
      const start = new Date(end);start.setDate(start.getDate()-6);
      const s = start.toISOString().slice(0,10), e = end.toISOString().slice(0,10);
      const m = arr.filter(t=>t.date>=s && t.date<=e).reduce((s,t)=>s+t.minutes,0);
      labels.push(`${start.getMonth()+1}/${start.getDate()}`);
      data.push(+(m/60).toFixed(1));
    }
    return {labels,data,unit:'h'};
  }
  if(mode==='month'){
    const labels=[],data=[];
    for(let i=5;i>=0;i--){
      const d = new Date();d.setMonth(d.getMonth()-i);
      const ym = d.toISOString().slice(0,7);
      const m = arr.filter(t=>t.date.startsWith(ym)).reduce((s,t)=>s+t.minutes,0);
      labels.push(`${d.getMonth()+1}月`);
      data.push(+(m/60).toFixed(1));
    }
    return {labels,data,unit:'h'};
  }
  if(mode==='year'){
    const labels=[],data=[];
    for(let i=11;i>=0;i--){
      const d = new Date();d.setMonth(d.getMonth()-i);
      const ym = d.toISOString().slice(0,7);
      const m = arr.filter(t=>t.date.startsWith(ym)).reduce((s,t)=>s+t.minutes,0);
      labels.push(`${d.getMonth()+1}月`);
      data.push(+(m/60).toFixed(1));
    }
    return {labels,data,unit:'h'};
  }
}
function renderTimeChart(mode){
  const a = aggTime(mode);

  ensureChart('timeChart',{

        <button class="btn" onclick="saveWrong('${mid}')">保存</button>
      </div>
    </div>
  </div>`;
  // input tabs
  document.querySelectorAll('.input-tab').forEach(t=>{
    t.onclick = ()=>{
      document.querySelectorAll('.input-tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('.w-input-pane').forEach(p=>p.style.display='none');
      document.getElementById('w_input_'+t.dataset.t).style.display='block';
    };
  });
  // img preview
  let imgArr = [];
  document.getElementById('w_files').onchange = e=>{
    const files = Array.from(e.target.files);
    files.forEach(f=>{
      const r = new FileReader();
      r.onload = ev=>{
        imgArr.push(ev.target.result);
        renderImgPreview();
      };
      r.readAsDataURL(f);
    });
  };
  function renderImgPreview(){
    document.getElementById('w_preview').innerHTML = imgArr.map((s,i)=>`<div style="position:relative"><img class="wr-img" src="${s}"/><div style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#fff;color:#e0a0a0;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer" onclick="imgArr.splice(${i},1);renderImgPreview()">×</div></div>`).join('');
  }
  // audio record
  let mediaRec = null, recChunks = [];
  window.toggleRecord = ()=>{
    const btn = document.getElementById('recBtn');
    if(!mediaRec || mediaRec.state==='inactive'){
      navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
        mediaRec = new MediaRecorder(stream);
        recChunks = [];
        mediaRec.ondataavailable = e=>recChunks.push(e.data);
        mediaRec.onstop = ()=>{
          const blob = new Blob(recChunks,{type:'audio/webm'});
          const url = URL.createObjectURL(blob);
          document.getElementById('recPlay').src=url;
          document.getElementById('recPlay').style.display='block';
          document.getElementById('recStatus').textContent='已录制，点击播放试听';
          // convert to dataURL for storage
          const r = new FileReader();
          r.onload = ev=>{ window._recordedAudio = ev.target.result; };
          r.readAsDataURL(blob);
        };
        mediaRec.start();
        btn.textContent='⏹️ 停止录音';
        btn.classList.add('recording');
        document.getElementById('recStatus').textContent='正在录音...';
      }).catch(err=>{
        document.getElementById('recStatus').textContent='无法访问麦克风：'+err.message;
      });
    } else {
      mediaRec.stop();
      mediaRec.stream.getTracks().forEach(t=>t.stop());
      btn.textContent='🎙️ 重新录音';
      btn.classList.remove('recording');
    }
  };
  window.imgArr = imgArr;
  window._recordedAudio = null;
}

function renderPaperStats(){
  const wrap = document.getElementById('paperStats');
  if(!wrap) return;
  const list = state.papers;
  if(list.length===0){wrap.innerHTML=`<div class="empty"><span class="em">📝</span>还没有录入套卷，点击右上角开始记录</div>`;return;}
  const sorted = [...list].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const latest = sorted[0];
  const totalScore = latest.totalScore||0;
  const beat = latest.beatRate||'-';
  // total accuracy
  let totalAll=0, correctAll=0;
  list.forEach(p=>{
    totalAll += (p.yanYu?.total||0)+(p.ziLiao?.total||0)+(p.panDuan?.tuJie?.total||0)+(p.panDuan?.luoJi?.total||0)+(p.panDuan?.dingYi?.total||0)+(p.shuLiang?.total||0)+(p.changShi?.total||0);
    correctAll += (p.yanYu?.correct||0)+(p.ziLiao?.correct||0)+(p.panDuan?.tuJie?.correct||0)+(p.panDuan?.luoJi?.correct||0)+(p.panDuan?.dingYi?.correct||0)+(p.shuLiang?.correct||0)+(p.changShi?.correct||0);
  });
  const rate = totalAll?Math.round(correctAll/totalAll*100):0;
  wrap.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="si">📊</div><div class="sv">${totalScore||'-'}</div><div class="sl">最近总分</div></div>

    </div>

  `;
}
function paperSubRate(p,key){
  const obj = key==='tuJie'?p.panDuan?.tuJie : key==='luoJi'?p.panDuan?.luoJi : key==='dingYi'?p.panDuan?.dingYi : p[key];

function renderPaperChart(mode){
  const list = [...state.papers].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let labels=[],scores=[],rates=[];
  if(mode==='day'){
    list.slice(-14).forEach(p=>{
      labels.push(p.date.slice(5));
      scores.push(p.totalScore||0);
      let t=0,c=0;
      ['yanYu','ziLiao','shuLiang','changShi'].forEach(k=>{t+=p[k]?.total||0;c+=p[k]?.correct||0;});
      ['tuJie','luoJi','dingYi'].forEach(k=>{t+=p.panDuan?.[k]?.total||0;c+=p.panDuan?.[k]?.correct||0;});
      rates.push(t?Math.round(c/t*100):null);
    });
  } else if(mode==='week'){
    const groups = {};
    list.forEach(p=>{
      const d = new Date(p.date);
      const day = d.getDay()||7;
      d.setDate(d.getDate()-day+1);
      const key = d.toISOString().slice(0,10);
      if(!groups[key]) groups[key]=[];
      groups[key].push(p);
    });
    Object.entries(groups).slice(-8).forEach(([k,arr])=>{
      const avg = arr.reduce((s,p)=>s+(p.totalScore||0),0)/arr.length;
      let t=0,c=0;
      arr.forEach(p=>{
        ['yanYu','ziLiao','shuLiang','changShi'].forEach(k=>{t+=p[k]?.total||0;c+=p[k]?.correct||0;});
        ['tuJie','luoJi','dingYi'].forEach(k=>{t+=p.panDuan?.[k]?.total||0;c+=p.panDuan?.[k]?.correct||0;});
      });
      labels.push(k.slice(5));
      scores.push(+avg.toFixed(1));
      rates.push(t?Math.round(c/t*100):null);
    });
  } else if(mode==='month') {
    const groups = {};
    list.forEach(p=>{
      const ym = p.date.slice(0,7);
      if(!groups[ym]) groups[ym]=[];
      groups[ym].push(p);
    });
    Object.entries(groups).slice(-6).forEach(([k,arr])=>{
      const avg = arr.reduce((s,p)=>s+(p.totalScore||0),0)/arr.length;
      let t=0,c=0;
      arr.forEach(p=>{
        ['yanYu','ziLiao','shuLiang','changShi'].forEach(k=>{t+=p[k]?.total||0;c+=p[k]?.correct||0;});
        ['tuJie','luoJi','dingYi'].forEach(k=>{t+=p.panDuan?.[k]?.total||0;c+=p.panDuan?.[k]?.correct||0;});
      });
      labels.push(k.slice(5));
      scores.push(+avg.toFixed(1));
      rates.push(t?Math.round(c/t*100):null);
    });
  } else {
    const groups = {};
    list.forEach(p=>{
      const ym = p.date.slice(0,7);
      if(!groups[ym]) groups[ym]=[];
      groups[ym].push(p);
    });
    Object.entries(groups).slice(-12).forEach(([k,arr])=>{
      const avg = arr.reduce((s,p)=>s+(p.totalScore||0),0)/arr.length;
      let t=0,c=0;
      arr.forEach(p=>{
        ['yanYu','ziLiao','shuLiang','changShi'].forEach(k=>{t+=p[k]?.total||0;c+=p[k]?.correct||0;});
        ['tuJie','luoJi','dingYi'].forEach(k=>{t+=p.panDuan?.[k]?.total||0;c+=p.panDuan?.[k]?.correct||0;});
      });
      labels.push(k.slice(5));
      scores.push(+avg.toFixed(1));
      rates.push(t?Math.round(c/t*100):null);
    });
  }
  prepChartWrap('paperChart', labels.length);
  ensureChart('paperChart',{
    type:'line',
    data:{
      labels,
      datasets:[
        {label:'总分',data:scores,borderColor:'#5fc4c0',backgroundColor:'rgba(95,196,192,.15)',borderWidth:2.5,tension:.4,pointRadius:4,fill:false,yAxisID:'y'},
        {label:'正确率%',data:rates,borderColor:'#ff9abf',backgroundColor:'rgba(255,154,191,.15)',borderWidth:2.5,tension:.4,pointRadius:4,fill:false,spanGaps:true,yAxisID:'y1'}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,position:'top',labels:{boxWidth:10,font:{size:10},color:'#5a6f6c'}}},
      scales:{
        x:{grid:{display:false},ticks:{color:'#8aa3a0',font:{size:10}}},
        y:{position:'left',grid:{color:'rgba(168,224,204,.2)'},ticks:{color:'#8aa3a0',font:{size:10}},beginAtZero:true},
        y1:{position:'right',grid:{display:false},ticks:{color:'#8aa3a0',font:{size:10},callback:v=>v+'%'},min:0,max:100,beginAtZero:true}
      }
    }
  });
}

/* ============ Memo (备忘录 + 小动物提醒) ============ */
const PETS = ['🐰','🐱','🐶','🐻','🦊','🐼','🐯','🐨','🐸','🐥','🐧','🦁','🐵','🐷','🐮','🐹','🦄','🐢','🐙','🐤','🐭','🐔'];
function petFor(id){
  let h=0;
  for(let i=0;i<id.length;i++){h=id.charCodeAt(i)+((h<<5)-h);}
  return PETS[Math.abs(h)%PETS.length];
}
function memoDays(dueDate){
  const today=new Date();today.setHours(0,0,0,0);
  return Math.ceil((new Date(dueDate)-today)/86400000);
}
function pageMemo(){
  return `
  <div class="page-head">
    <div><div class="page-title"><span class="em">🗒️</span>备忘录</div><div class="page-sub">便签 · 带截止时间的提醒</div></div>
    <button class="btn" onclick="openMemoModal()">＋ 新建</button>
  </div>
  <div id="memoDueArea"></div>
  <div class="divider"></div>
  <div class="page-head">
    <div><div class="page-title"><span class="em">📋</span>全部便签</div><div class="page-sub">没有截止时间的日常记录</div></div>
  </div>
  <div id="memoListArea"></div>
  `;
}
function initMemo(){
  renderMemoDue();
  renderMemoList();
}
function renderMemoDue(){
  const wrap = document.getElementById('memoDueArea');
  if(!wrap) return;
  const due = (state.memos||[]).filter(m=>m.dueDate)
    .map(m=>({m,days:memoDays(m.dueDate)}))
    .sort((a,b)=> (a.m.done?1:0)-(b.m.done?1:0) || a.days-b.days);
  if(due.length===0){wrap.innerHTML='';return;}
  wrap.innerHTML = `
    <div class="page-head"><div><div class="page-title"><span class="em">⏰</span>带截止时间</div><div class="page-sub">小动物陪你倒数 🐰</div></div></div>
    ${due.map(x=>{
      const urgent = x.days<=5 && !x.m.done;
      const txt = x.m.done?'已完成 ✅': x.days<0?`已过期 ${-x.days} 天`:x.days===0?'就是今天！':x.days+' 天后';
      return `<div class="memo-row ${x.m.done?'':(urgent?'urgent':'due')}">
        <div class="pet-avatar">${petFor(x.m.id)}</div>
        <div class="m-body">
          <div class="m-title">${escapeHtml(x.m.title)}</div>
          ${x.m.content?`<div class="m-content">${escapeHtml(x.m.content)}</div>`:''}

        <div class="m-actions">
          <button class="check ${x.m.done?'checked':''}" onclick="toggleMemoDone('${x.m.id}')">${x.m.done?'✓':''}</button>
          <button class="icon-btn" onclick="editMemo('${x.m.id}')">✎</button>
          <button class="icon-btn" onclick="delMemo('${x.m.id}')">🗑</button>
        </div>
      </div>`;
    }).join('')}
  `;
}
function renderMemoList(){
  const wrap = document.getElementById('memoListArea');
  if(!wrap) return;
  const list = (state.memos||[]).filter(m=>!m.dueDate);
  if(list.length===0){wrap.innerHTML=`<div class="empty"><span class="em">🗒️</span>还没有便签，点击右上"新建"记一条吧</div>`;return;}

function renderMemoAlert(){
  const area = document.getElementById('memoAlertArea');
  if(!area) return;
  const near = (state.memos||[]).filter(m=>m.dueDate && !m.done)

      <h3>${title}</h3>

  document.getElementById('modalRoot').innerHTML='';

/* ============ Util ============ */
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ 复盘仪表盘（基于 WorkPulse 思路，适配 Nora上岸 备考数据） ============ */
let reviewDashInited = false;

function fmtDate(dt){
  const y=dt.getFullYear(); const m=String(dt.getMonth()+1).padStart(2,'0'); const d=String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function fmtDur(min){ min=+min||0; if(min<60) return min+' 分钟'; const h=Math.floor(min/60); const m=min%60; return (h?h+' 小时':'')+(m?m+' 分':''); }
function reviewHeatLevel(mins){
  if(!mins) return 0;
  if(mins<60) return 1;
  if(mins<120) return 2;
  if(mins<180) return 3;
  return 4;
}
function reviewAgg(start, end){
  start = start || '0000-00-00';
  end = end || '9999-99-99';
  const st=(state.studyTime||[]).filter(r=>r.date>=start&&r.date<=end);
  const qa=(state.qaStats||[]).filter(r=>r.date>=start&&r.date<=end);
  const dp=(state.dailyPlan||[]).filter(r=>r.date>=start&&r.date<=end);
  const wq=(state.wrongQ||[]).filter(r=>r.date>=start&&r.date<=end);
  const pp=(state.papers||[]).filter(r=>r.date>=start&&r.date<=end);

  dp.forEach(r=>modAdd(r.module,0,0,r.timeMin));

    else if(rate30<50||maxGap>=4){ level='warn'; finding=`连续打卡 ${streak} 天，但近 30 天仅打卡 ${active30} 天（${rate30}%），最长中断 ${maxGap} 天。`; suggestion='打卡频率不够稳。建议用「最低限度目标」——即使再忙也学 15 分钟，保证每日不断更。'; }
    else { finding=`连续打卡 ${streak} 天，近 30 天打卡 ${active30} 天（${rate30}%），节奏稳定 👍。`; suggestion='保持现在的节奏，把「每日打卡」做成像刷牙一样自然的习惯。'; }
    dims.push({key:'checkin',name:'打卡习惯',icon:'📅',level,finding,suggestion});
  })();
  (function(){
    let level='good', finding, suggestion; const wh=Math.round(weeklyAvgH*10)/10;
    if(weeklyAvgH<5){ level='danger'; finding=`累计学习 ${fmtDur(totalMin)}，周均仅约 ${wh} 小时，投入偏少。`; suggestion='备考需要足够的时长沉淀。尝试把周目标定到 10 小时以上，并拆成每天 1.5 小时的可执行块。'; }
    else if(weeklyAvgH<10||trend==='down'){ level='warn'; finding=`周均约 ${wh} 小时${trend==='down'?'，且近 4 周比前 4 周下降':''}。`; suggestion=trend==='down'?'最近学习量在下滑，留意是否进入瓶颈或疲劳期，适当调整节奏但别停。':'时长还可提升，向周均 10–15 小时靠拢会更稳。'; }
    else { finding=`周均约 ${wh} 小时，时长充足${trend==='up'?'且呈上升趋势 📈':''}。`; suggestion='时长到位了，接下来把精力更多放在「正确率」和「弱科突破」上。'; }
    dims.push({key:'time',name:'学习时长',icon:'⏱️',level,finding,suggestion});
  })();
  (function(){
    if(mods.length===0){ dims.push({key:'balance',name:'科目均衡',icon:'⚖️',level:'good',finding:'暂无分科目数据。',suggestion:'在各科目页面记录学习/做题后，这里会给出偏科与弱科提醒。'}); return; }
    let level='good', finding, suggestion;
    if(maxShare>65){ level='warn'; finding=`${topMod.name} 占全部学习时长的 ${Math.round(maxShare)}%，存在明显偏科。`; suggestion=`别让强势科目吃掉所有时间。给占比最低的科目每周固定留出专项时段，均衡发展更抗风险。`; }
    else if(weakByTime.length){ level='warn'; finding=`有 ${weakByTime.length} 个科目投入占比不足 12%：${weakByTime.map(m=>m.name).join('、')}。`; suggestion=`这些科目容易被忽视。建议每周给 ${weakByTime[0].name} 至少排 2 次固定学习，避免考前突击。`; }
    else { finding=`各科目时长分布较均衡，最高 ${topMod.name} 占 ${Math.round(maxShare)}%。`; suggestion='均衡投入有利于总分最大化，继续保持。'; }
    dims.push({key:'balance',name:'科目均衡',icon:'⚖️',level,finding,suggestion});
  })();
  (function(){
    if(mods.length===0){ dims.push({key:'acc',name:'答题正确率',icon:'🎯',level:'good',finding:'暂无做题数据。',suggestion:'记录做题量与正确数后，会提示正确率偏低的科目。'}); return; }
    if(lowAccMods.length){ const lv=lowAccMods.some(m=>m.acc<45)?'danger':'warn'; const finding=`有 ${lowAccMods.length} 个科目正确率偏低（<60%）：${lowAccMods.map(m=>m.name+' '+Math.round(m.acc)+'%').join('、')}。`; const suggestion=`正确率低通常说明基础或方法有问题。建议对 ${lowAccMods[0].name} 做专项：先复盘错题、再刷同类题，把正确率拉到 70% 以上再提速。`; dims.push({key:'acc',name:'答题正确率',icon:'🎯',level:lv,finding,suggestion}); }
    else { const accs=mods.filter(m=>m.acc!=null); const avgAcc=accs.length?Math.round(accs.reduce((s,m)=>s+m.acc,0)/accs.length):0; dims.push({key:'acc',name:'答题正确率',icon:'🎯',level:'good',finding:`各科目正确率整体不错，平均约 ${avgAcc}%。`,suggestion:'正确率在线，下一步可适度提速、挑战更高难度题。'}); }
  })();
  (function(){
    let level='good', finding, suggestion;
    if(wrongCnt===0){ finding='暂未记录错题。'; suggestion='遇到错题及时录入，系统才能帮你定位薄弱点。'; }
    else if(wrongCnt>40){ level='warn'; finding=`已积累 ${wrongCnt} 道错题${topWrong?`，最多在「${topWrong}」`:''}。`; suggestion='错题在堆积说明复盘没跟上。建议设固定「错题回顾日」（如每周日），按科目重做，做对的再归档。'; }
    else { finding=`已记录 ${wrongCnt} 道错题${topWrong?`，集中在「${topWrong}」`:''}。`; suggestion='保持录入习惯，并定期重做，让错题真正「清零」。'; }
    dims.push({key:'wrong',name:'错题管理',icon:'❌',level,finding,suggestion});
  })();
  (function(){
    if(paperCnt===0){ dims.push({key:'paper',name:'套卷模考',icon:'📝',level:'good',finding:'暂未记录套卷。',suggestion:'临近考试时，每周做 1 套完整套卷能显著提升应试节奏。'}); return; }
    let level='good', finding, suggestion; const avgTxt=paperAvg!=null?Math.round(paperAvg*10)/10:null;
    if(paperCnt<3){ level='warn'; finding=`仅 ${paperCnt} 套套卷${avgTxt!=null?`，均分 ${avgTxt}`:''}。`; suggestion='套卷练得太少，难以暴露时间分配与应试短板。建议每周固定 1 套全真模考，严格计时。'; }
    else if(paperTrend!=null&&paperTrend<-3){ level='warn'; finding=`共 ${paperCnt} 套，均分 ${avgTxt}，但近期分数有所回落（约 ${Math.round(paperTrend*10)/10} 分）。`; suggestion='分数回落别慌，往往是难度或状态波动。回看最近几套的错题分布，针对性补强后再考。'; }
    else if(paperTrend!=null&&paperTrend>3){ finding=`共 ${paperCnt} 套，均分 ${avgTxt}，且呈上升趋势 📈。`; suggestion='模考状态在变好，保持每周节奏，考前一周转为复盘而非猛练。'; }
    else { finding=`共 ${paperCnt} 套，均分 ${avgTxt}，分数较平稳。`; suggestion='平稳是好信号，想再突破可尝试在弱科限时提速训练。'; }
    dims.push({key:'paper',name:'套卷模考',icon:'📝',level,finding,suggestion});
  })();
  (function(){
    if(taskRate==null){ dims.push({key:'task',name:'任务执行',icon:'✅',level:'good',finding:'暂未记录每日任务。',suggestion:'在打卡页添加每日任务，系统会追踪你的完成率。'}); return; }
    let level='good', finding, suggestion;
    if(taskRate<40){ level='danger'; finding=`任务完成率仅 ${Math.round(taskRate)}%（${tasksDone}/${tasks}）。`; suggestion='完成率偏低，计划可能定得太满。把每天任务砍到「必做 3 件」，完成后再追加，先找回成就感。'; }
    else if(taskRate<60){ level='warn'; finding=`任务完成率 ${Math.round(taskRate)}%（${tasksDone}/${tasks}），有拖欠。`; suggestion='计划略超载。建议按「80% 可完成」来排任务量，留缓冲应对突发。'; }
    else { finding=`任务完成率 ${Math.round(taskRate)}%（${tasksDone}/${tasks}），执行到位 👍。`; suggestion='计划落地率高，保持这种「量力而定」的排期节奏。'; }
    dims.push({key:'task',name:'任务执行',icon:'✅',level,finding,suggestion});
  })();

  let score=100;
  if(streak===0||daysSince>3) score-=22; else if(streak<=2) score-=14; else if(streak<=6) score-=6;
  if(rate30<30) score-=18; else if(rate30<50) score-=10; else if(rate30<70) score-=4;
  if(weeklyAvgH<5) score-=16; else if(weeklyAvgH<10) score-=8; else if(weeklyAvgH<15) score-=3;
  if(trend==='down') score-=10;
  if(maxShare>65) score-=8;
  score-=Math.min(18, lowAccMods.length*6);
  if(wrongCnt>40) score-=6;
  if(paperCnt<3) score-=6;
  if(taskRate!=null){ if(taskRate<40) score-=10; else if(taskRate<60) score-=6; else if(taskRate<75) score-=2; }
  score=Math.max(0,Math.min(100,Math.round(score)));
  let label, desc;
  if(score>=85){ label='优秀'; desc='各项指标健康，保持节奏、稳中求进。'; }
  else if(score>=70){ label='良好'; desc='整体不错，补上少数短板就能更稳。'; }
  else if(score>=55){ label='中等'; desc='基础在，但有几处明显短板需补强。'; }
  else if(score>=40){ label='需加油'; desc='当前有多个维度亮红灯，建议优先处理重点建议。'; }
  else { label='偏弱'; desc='学习状态需要尽快调整，从「每天打卡」这一件事先做起。'; }
  const priorities=dims.filter(d=>d.level!=='good').sort((a,b)=>(a.level===b.level?0:(a.level==='danger'?-1:1))).slice(0,4);
  if(priorities.length===0) desc='太棒了，目前未发现明显短板，保持即可 🎉';
  return {hasData,score,label,desc,dims,priorities};
}
function dimCardHTML(d){
  const badge=d.level==='danger'?'<span class="sd-badge danger">紧急</span>':d.level==='warn'?'<span class="sd-badge warn">提醒</span>':'';
  return `<div class="smart-dim ${d.level}">
    <div class="sd-head"><span class="sd-ico">${d.icon}</span><span class="sd-name">${d.name}</span>${badge}</div>
    <div class="sd-find">${d.finding}</div>
    <div class="sd-tip">💡 ${d.suggestion}</div>
  </div>`;
}
function renderReviewSmart(){
  const box=document.getElementById('revScore'), pr=document.getElementById('revPriorities'), dm=document.getElementById('revDims');
  if(!box) return;
  const a=smartAnalyze();
  if(!a.hasData){ box.innerHTML='<div class="empty"><div class="empty-title">还没有足够数据</div><div class="empty-sub">先去记录学习打卡、做题和任务，再来生成智能建议～</div></div>'; if(pr)pr.innerHTML=''; if(dm)dm.innerHTML=''; return; }
  const color=a.score>=70?'#5cc4a3':a.score>=50?'#ffb547':'#ff6b6b';
  const deg=a.score*3.6;
  box.innerHTML=`<div class="rev-score-wrap">
    <div class="score-ring" style="background:conic-gradient(${color} ${deg}deg, #e6f2ee ${deg}deg)">
      <div class="score-inner"><div class="score-num" style="color:${color}">${a.score}</div><div class="score-sub">备考指数</div></div>
    </div>
    <div class="score-meta">
      <div class="score-label" style="color:${color}">${a.label}</div>
      <div class="score-desc">${a.desc}</div>
    </div>
  </div>`;
  if(pr) pr.innerHTML = a.priorities.length? a.priorities.map(dimCardHTML).join('') : '<div class="empty"><div class="empty-title">暂无紧急事项 🎉</div><div class="empty-sub">当前各项指标良好，继续保持。</div></div>';
  if(dm) dm.innerHTML = a.dims.map(dimCardHTML).join('');
}

init();
</script>
<script>
(function(){
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault();
    dp=e;
    pwaDeferred=true;
    renderInstallBtn();
  });
  window.addEventListener("appinstalled",function(){ dp=null; pwaDeferred=false; renderInstallBtn(); });
})();
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
